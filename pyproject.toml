[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowxer"
version = "2.6.8"
description = "DMF Vision Mixer microservice for uncompressed MXL (v210 + float32) workflows"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "FlowXer" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "aiofiles>=24.1.0",
  "pillow>=10.4.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]
webrtc = [
  "aiortc==1.9.0",
]

[project.scripts]
flowxer = "flowxer.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowxer = ["static/*", "graphics/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
