server {
    listen ${FLOWXER_GUI_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Library uploads: 8 MiB chunks and whole TGA folders. The mixer enforces
    # FLOWXER_UPLOAD_LIMIT_GB and the chunk sizes; nginx streams the body through
    # instead of buffering it (nginx's default limit of 1 MB would answer 413).
    location /api/v1/uploads {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/flowxer-auth.inc;
        proxy_pass ${FLOWXER_MIXER_URL};
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/flowxer-auth.inc;
        proxy_pass ${FLOWXER_MIXER_URL};
    }

    location /graphics/ {
        include /etc/nginx/conf.d/flowxer-auth.inc;
        proxy_pass ${FLOWXER_MIXER_URL};
    }

    location /docs {
        include /etc/nginx/conf.d/flowxer-auth.inc;
        proxy_pass ${FLOWXER_MIXER_URL};
    }

    location /redoc {
        include /etc/nginx/conf.d/flowxer-auth.inc;
        proxy_pass ${FLOWXER_MIXER_URL};
    }

    location /openapi.json {
        include /etc/nginx/conf.d/flowxer-auth.inc;
        proxy_pass ${FLOWXER_MIXER_URL};
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
