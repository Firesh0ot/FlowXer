server {
    listen ${FLOWXER_GUI_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Library uploads: 8 MiB chunks and whole TGA folders. The mixer enforces
    # FLOWXER_UPLOAD_LIMIT_GB and the chunk sizes; nginx streams the body through
    # instead of buffering it (nginx's default limit of 1 MB would answer 413).
    location /api/v1/uploads {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/flowxer-auth.inc;
        proxy_pass ${FLOWXER_MIXER_URL};
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/flowxer-auth.inc;
        proxy_pass ${FLOWXER_MIXER_URL};
    }

    # Operator-screen widgets: the list (CORS for the origins in WIDGET_FRAME_ANCESTORS) and the
    # pages, which only those origins may frame (CSP frame-ancestors; no X-Frame-Options anywhere).
    # 50-flowxer-widgets.sh writes the .inc files and the origin map from WIDGET_FRAME_ANCESTORS.
    location = /widgets {
        # Only these origins: the mixer's API answers every origin.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Vary;
        include /etc/nginx/conf.d/flowxer-widgets-cors.inc;
        include /etc/nginx/conf.d/flowxer-auth.inc;
        proxy_pass ${FLOWXER_MIXER_URL}/api/v1/widgets;
    }

    location = /widget/bus {
        if ($arg_me !~ "^[1-4]$") {
            return 400 "me must be an ME 1..4\n";
        }
        if ($arg_theme !~ "^(|dark|light|transparent)$") {
            return 400 "theme must be dark, light or transparent\n";
        }
        if ($arg_transition !~ "^(|true|false)$") {
            return 400 "transition must be true or false\n";
        }
        include /etc/nginx/conf.d/flowxer-widgets-csp.inc;
        try_files /widget.html =404;
    }

    location = /widget/keys {
        if ($arg_me !~ "^[1-4]$") {
            return 400 "me must be an ME 1..4\n";
        }
        if ($arg_theme !~ "^(|dark|light|transparent)$") {
            return 400 "theme must be dark, light or transparent\n";
        }
        include /etc/nginx/conf.d/flowxer-widgets-csp.inc;
        try_files /widget.html =404;
    }

    location = /widget/dme {
        if ($arg_me !~ "^[1-4]$") {
            return 400 "me must be an ME 1..4\n";
        }
        if ($arg_keyer !~ "^[1-8]$") {
            return 400 "keyer must be an upstream keyer 1..8\n";
        }
        if ($arg_theme !~ "^(|dark|light|transparent)$") {
            return 400 "theme must be dark, light or transparent\n";
        }
        include /etc/nginx/conf.d/flowxer-widgets-csp.inc;
        try_files /widget.html =404;
    }

    location = /widget/audio {
        if ($arg_me !~ "^[1-4]$") {
            return 400 "me must be an ME 1..4\n";
        }
        if ($arg_faders !~ "^(|true|false)$") {
            return 400 "faders must be true or false\n";
        }
        if ($arg_theme !~ "^(|dark|light|transparent)$") {
            return 400 "theme must be dark, light or transparent\n";
        }
        include /etc/nginx/conf.d/flowxer-widgets-csp.inc;
        try_files /widget.html =404;
    }

    location = /widget/snapshots {
        if ($arg_me !~ "^(|[1-4])$") {
            return 400 "me must be an ME 1..4\n";
        }
        if ($arg_all !~ "^(|true|false)$") {
            return 400 "all must be true or false\n";
        }
        if ($arg_theme !~ "^(|dark|light|transparent)$") {
            return 400 "theme must be dark, light or transparent\n";
        }
        include /etc/nginx/conf.d/flowxer-widgets-csp.inc;
        try_files /widget.html =404;
    }

    location /widget/ {
        return 404 "widget not found\n";
    }

    location /docs {
        include /etc/nginx/conf.d/flowxer-auth.inc;
        proxy_pass ${FLOWXER_MIXER_URL};
    }

    location /redoc {
        include /etc/nginx/conf.d/flowxer-auth.inc;
        proxy_pass ${FLOWXER_MIXER_URL};
    }

    location /openapi.json {
        include /etc/nginx/conf.d/flowxer-auth.inc;
        proxy_pass ${FLOWXER_MIXER_URL};
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
