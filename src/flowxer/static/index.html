<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlowXer · Vision Mixer</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/static/panel.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark">FX</span>
      <div>
        <h1>FlowXer</h1>
        <p>DMF Vision Mixer · uncompressed v210 + float32</p>
        <p><a href="http://localhost:9620">Open operator GUI</a></p>
      </div>
    </div>
    <nav>
      <a href="/docs" target="_blank" rel="noreferrer">OpenAPI</a>
      <a href="/redoc" target="_blank" rel="noreferrer">ReDoc</a>
    </nav>
    <div id="health" class="pill">…</div>
  </header>

  <main>
    <section class="status-grid">
      <article>
        <h2>Program</h2>
        <div id="pgm" class="bus">—</div>
        <div id="bus" class="muted"></div>
      </article>
      <article>
        <h2>Preview</h2>
        <div id="pvw" class="bus">—</div>
      </article>
      <article>
        <h2>Engine</h2>
        <div id="engine">stopped</div>
      </article>
      <article>
        <h2>DSK 1</h2>
        <div id="dsk">off</div>
      </article>
    </section>

    <section>
      <div class="row">
        <h2>Logical inputs</h2>
        <div class="actions">
          <button id="start">Start mixer</button>
          <button id="stop" class="ghost">Stop</button>
        </div>
      </div>
      <div id="inputs" class="inputs"></div>
    </section>

    <section>
      <div class="actions">
        <button id="key-on">DSK 1 ON</button>
        <button id="key-off" class="ghost">DSK 1 OFF</button>
      </div>
    </section>
  </main>
  <script src="/static/panel.js"></script>
</body>
</html>
