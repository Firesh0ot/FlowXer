# FlowXer on the pod network with the MXL platform's standard env names
# (mxl-poc-platform media function contract). Edit nodeSelector, registry
# address, seed and tags before apply.
#
# The mixer listens on 0.0.0.0:9610 inside the pod (the API token guards it;
# /livez, /readyz and /metrics are open) and the GUI on 9620 proxies /api to it.
# The node announces the pod IP (NMOS_HOST_ADDRESS from the downward API).
# WebRTC previews need the pod IP to be routable from the browser; the GUI
# falls back to JPEG otherwise.
---
apiVersion: v1
kind: Namespace
metadata:
  name: flowxer
---
apiVersion: v1
kind: Secret
metadata:
  name: flowxer-api-token
  namespace: flowxer
type: Opaque
stringData:
  FLOWXER_API_TOKEN: "replace-me"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowxer-pod
  namespace: flowxer
data:
  FLOWXER_HOST: "0.0.0.0"
  FLOWXER_PORT: "9610"
  FLOWXER_MIXER_URL: "http://127.0.0.1:9610"
  FLOWXER_GUI_PORT: "9620"
  FLOWXER_STORAGE_ROOT: "/storage"
  FLOWXER_STATE_DIR: "/config"
  MXL_DOMAIN_SCAN_PATH: "/Volumes/mxl"
  MXL_CLEANUP_ON_EXIT: "true"
  NMOS_SEED: "demo-flowxer-1"
  NMOS_LABEL: "FlowXer 1"
  NMOS_TAGS: '{"urn:x-srf:production":["demo"],"urn:x-srf:function":["flowxer-1"]}'
  NMOS_REGISTRY_ADDRESS: "10.0.0.5"
  NMOS_REGISTRY_PORT: "3210"
  NMOS_DNS_SD: "false"
  NMOS_PORT: "3252"
  SHUTDOWN_TIMEOUT_S: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowxer-1
  namespace: flowxer
  labels:
    app: flowxer-1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flowxer-1
  template:
    metadata:
      labels:
        app: flowxer-1
    spec:
      # Longer than SHUTDOWN_TIMEOUT_S: stop media, deregister, remove the domain.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        kubernetes.io/hostname: REPLACE_WITH_MXL_HOST
      tolerations:
        - key: mxl.srf.ch/media
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: mixer
          image: ghcr.io/firesh0ot/flowxer-vision-mixer:REPLACE_WITH_VERSION
          envFrom:
            - configMapRef:
                name: flowxer-pod
            - secretRef:
                name: flowxer-api-token
          env:
            - name: NMOS_HOST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FLOWXER_WEBRTC_PUBLIC_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: mixer
              containerPort: 9610
            - name: nmos
              containerPort: 3252
          livenessProbe:
            httpGet:
              path: /livez
              port: 9610
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9610
            periodSeconds: 5
          volumeMounts:
            - name: mxl
              mountPath: /Volumes/mxl
            - name: storage
              mountPath: /storage
            - name: config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        - name: gui
          image: ghcr.io/firesh0ot/flowxer-gui:REPLACE_WITH_VERSION
          envFrom:
            - configMapRef:
                name: flowxer-pod
            - secretRef:
                name: flowxer-api-token
          ports:
            - name: gui
              containerPort: 9620
          livenessProbe:
            tcpSocket:
              port: 9620
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      # hostPath directories are not chowned by fsGroup: make storage and config
      # writable for uid 1000 on the node (or use PersistentVolumeClaims).
      volumes:
        - name: mxl
          hostPath:
            path: /Volumes/mxl
            type: Directory
        - name: storage
          hostPath:
            path: /var/lib/flowxer/flowxer-1/storage
            type: DirectoryOrCreate
        - name: config
          hostPath:
            path: /var/lib/flowxer/flowxer-1/config
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: flowxer-1
  namespace: flowxer
  labels:
    app: flowxer-1
spec:
  selector:
    app: flowxer-1
  ports:
    - name: mixer
      port: 9610
      targetPort: 9610
    - name: gui
      port: 9620
      targetPort: 9620
    - name: nmos
      port: 3252
      targetPort: 3252
