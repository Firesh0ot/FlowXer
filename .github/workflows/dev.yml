name: Dev

# Coding branch. Every push increments the patch (code) counter.
# Tests run on pull requests via ci.yml — not on every dev push.

on:
  push:
    branches: [dev]

concurrency:
  group: version-dev
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip version]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/bump-version
        with:
          part: patch
