name: Stage

# Promotion branch. Pushing to stage bumps the minor (stage) counter,
# runs the test suite, builds containers without publishing, and starts a
# Cursor cloud agent in this repo's environment when CURSOR_API_KEY is set.

on:
  push:
    branches: [stage]
  workflow_dispatch:

concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  version:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip version]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: bump
        uses: ./.github/actions/bump-version
        with:
          part: minor

  test:
    needs: [version]
    if: ${{ always() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: GUI typecheck
        working-directory: gui
        run: |
          npm ci
          npx tsc --noEmit

  container:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage
      - uses: docker/setup-buildx-action@v3
      - name: Build mixer (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: flowxer-vision-mixer:stage
      - name: Build GUI (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gui/Dockerfile
          push: false
          tags: flowxer-gui:stage

  cursor:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Launch Cursor cloud agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "CURSOR_API_KEY is not set. Skipping Cursor environment test."
            echo "Add the secret, or create a Cursor Automation on Push to branch: stage."
            echo "See .cursor/automations/stage-test.md"
            exit 0
          fi
          sha="${{ github.sha }}"
          body=$(cat <<EOF
          {
            "prompt": {
              "text": "You are testing FlowXer on branch stage (commit ${sha}). Do not change code. Run pytest -q from the repo root after pip install -e '.[dev]'. In gui/ run npm ci && npx tsc --noEmit. Report pass/fail only. If tests fail, summarize the first failures."
            },
            "repos": [
              {
                "url": "https://github.com/${{ github.repository }}",
                "startingRef": "stage"
              }
            ],
            "autoCreatePR": false
          }
          EOF
          )
          curl --fail-with-body --request POST \
            --url https://api.cursor.com/v1/agents \
            -u "${CURSOR_API_KEY}:" \
            --header 'Content-Type: application/json' \
            --data "$body"
