name: Main

# Production branch. Manual merge into main bumps the major (main) counter,
# tags vX.Y.Z, and publishes mixer + GUI containers to GHCR.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip version]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: bump
        if: ${{ github.event_name == 'push' }}
        uses: ./.github/actions/bump-version
        with:
          part: major
          tag: "true"
      - name: Resolve version
        id: version
        run: echo "version=$(python3 scripts/bump_version.py show)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Image prefix
        id: image
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push mixer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            FLOWXER_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/flowxer-vision-mixer:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.image.outputs.owner }}/flowxer-vision-mixer:latest
      - name: Build and push GUI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gui/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/flowxer-gui:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.image.outputs.owner }}/flowxer-gui:latest
