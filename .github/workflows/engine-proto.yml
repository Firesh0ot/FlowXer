name: Engine prototype

# The mix engine prototype (engine/, P1): image ghcr.io/<owner>/flowxer-engine:proto-<short sha>
# and :proto-latest. Separate from the dev/stage/main release flow: no VERSION bump, no
# flowxer-vision-mixer tags. The build runs the unit tests (no GPU needed).

on:
  push:
    branches: [proto/mix-engine]
    paths:
      - "engine/**"
      - ".github/workflows/engine-proto.yml"
  workflow_dispatch:

concurrency:
  group: engine-proto
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Tags
        id: tags
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/flowxer-engine" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: engine
          file: engine/Dockerfile
          push: true
          # The deps stage (CUDA toolkit, vcpkg, MXL) changes rarely: keep it in the Actions cache.
          cache-from: type=gha,scope=engine-proto
          cache-to: type=gha,scope=engine-proto,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=proto-${{ steps.tags.outputs.short }}
            org.opencontainers.image.title=flowxer-engine
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.tags.outputs.image }}:proto-${{ steps.tags.outputs.short }}
            ${{ steps.tags.outputs.image }}:proto-latest
      - name: Summary
        run: |
          {
            echo "### flowxer-engine"
            echo "- \`${{ steps.tags.outputs.image }}:proto-${{ steps.tags.outputs.short }}\` (also \`proto-latest\`)"
            echo "- digest \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
