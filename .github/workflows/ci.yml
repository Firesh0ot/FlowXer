name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: GUI typecheck
        working-directory: gui
        run: |
          npm ci
          npx tsc --noEmit
