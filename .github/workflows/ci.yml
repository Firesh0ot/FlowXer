name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: GUI typecheck
        working-directory: gui
        run: |
          npm ci
          npx tsc --noEmit

  nmos-testing:
    name: AMWA NMOS testing tool
    # Run on every PR (including into dev) so Node/Connection API gaps fail
    # on the feature PR instead of the first promotion to stage.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nmos-testing
