name: CI

on:
  pull_request:
  workflow_dispatch:

# A new push to a PR replaces its running checks (the image job takes a while).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: GUI typecheck
        working-directory: gui
        run: |
          npm ci
          npx tsc --noEmit
          node --experimental-strip-types scripts/check-wipe.ts
          node --experimental-strip-types scripts/check-dme.ts
          node --experimental-strip-types scripts/check-fader.ts
          node --experimental-strip-types scripts/check-preview.ts

  engine:
    name: Engine unit tests
    # The media engine's logic (engine/src/core: ME state, transitions, keyers, mosaic map, TAI
    # grid, configuration, v210, audio). The CUDA, MXL and FFmpeg parts are built in the image
    # job below and checked on a GPU host (--selftest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ nlohmann-json3-dev
      - name: Build and test
        run: |
          cmake -S engine -B engine/build -G Ninja -DFXENG_BUILD_ENGINE=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build engine/build
          engine/build/fxeng-tests

  image:
    name: Mixer image
    # The whole mixer image (CUDA multi-stage: MXL, the engine and its unit tests, the control
    # plane), as stage and main build it. Not pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build mixer (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=mixer
          cache-to: type=gha,scope=mixer,mode=max
          tags: flowxer-vision-mixer:ci

  nmos-testing:
    name: AMWA NMOS testing tool
    # Run on every PR (including into dev) so Node/Connection API gaps fail
    # on the feature PR instead of the first promotion to stage.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nmos-testing
