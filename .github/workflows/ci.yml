name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: GUI typecheck
        working-directory: gui
        run: |
          npm ci
          npx tsc --noEmit

  nmos-testing:
    name: AMWA NMOS testing tool
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and start FlowXer (simulate + NMOS)
        run: |
          pip install -e '.[dev]'
          mkdir -p /tmp/mxl /tmp/flowxer-storage
          FLOWXER_SIMULATE=true FLOWXER_NMOS_ENABLE=true FLOWXER_NMOS_BIND=true \
            FLOWXER_NMOS_HOST_IP=127.0.0.1 FLOWXER_HOST=127.0.0.1 \
            FLOWXER_MXL_ROOT=/tmp/mxl FLOWXER_STORAGE_ROOT=/tmp/flowxer-storage \
            uvicorn flowxer.app:create_app --factory --host 127.0.0.1 --port 9610 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3252/x-nmos/node/v1.3/self && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3252/x-nmos/node/v1.3/self
          curl -fsS http://127.0.0.1:3252/x-nmos/connection/v1.2/single/receivers
      - name: Run AMWA testing image
        run: bash scripts/nmos-testing.sh http://127.0.0.1:3252
      - name: Upload AMWA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nmos-testing-results
          path: nmos-testing-results/
          if-no-files-found: ignore
