name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: GUI typecheck
        working-directory: gui
        run: |
          npm ci
          npx tsc --noEmit

  nmos-testing:
    name: AMWA NMOS testing tool
    # Skip ordinary PRs into dev (pytest is the gate). Run on the release path:
    # workflow_dispatch, and PRs into stage (dev→stage) or main (stage→main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (github.base_ref == 'stage' || github.base_ref == 'main'))
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nmos-testing
