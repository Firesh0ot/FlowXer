name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: GUI typecheck
        working-directory: gui
        run: |
          npm ci
          npx tsc --noEmit

  gstreamer:
    name: Pytest (GStreamer)
    # The media pipeline on the GStreamer of the mixer image (Ubuntu 24.04), with the
    # system Python and PyGObject the image uses. Without the MXL plugins it ends in
    # fakesinks.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             python3-gi python3-venv gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0             gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good             gstreamer1.0-plugins-bad gstreamer1.0-libav gstreamer1.0-x
      - name: Install
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Test
        run: .venv/bin/pytest -q tests/test_gst_media.py
      - name: Audio channel diagnostics (temporary)
        if: always()
        run: |
          for caps in "channels=16,channel-mask=(bitmask)0xffff" "channels=16,channel-mask=(bitmask)0x0"; do
            for chain in "audioconvert" 'capssetter caps="audio/x-raw,channel-mask=(bitmask)0x0" ! audioconvert'; do
              for out in "channels=2" "channels=2,channel-mask=(bitmask)0x0"; do
                echo "=== in: $caps | $chain | out: $out"
                GST_DEBUG=2,audioconvert:4,audio-converter:4,capssetter:4 gst-launch-1.0 -q audiotestsrc num-buffers=3 \
                  ! "audio/x-raw,format=F32LE,layout=interleaved,rate=48000,$caps" ! $chain \
                  ! "audio/x-raw,format=F32LE,layout=interleaved,rate=48000,$out" ! fakesink 2>&1 | tail -6 && echo "exit $?"
              done
            done
          done

  nmos-testing:
    name: AMWA NMOS testing tool
    # Run on every PR (including into dev) so Node/Connection API gaps fail
    # on the feature PR instead of the first promotion to stage.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nmos-testing
